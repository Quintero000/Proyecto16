
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 16 - Menú Desplegable</title>

    <!-- Conectar archivo CSS -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <div class="contenedor">

        <h1>Menú Desplegable Personalizado</h1>

        <p>Selecciona un elemento de la lista:</p>

        <!-- Contenedor del menú desplegable -->
        <div class="desplegable">

            <!-- Botón que muestra la opción seleccionada -->
            <button class="boton-desplegable" id="botonDesplegable">
                <span id="textoSeleccionado">Selecciona un elemento</span>

                <!-- Flecha del menú -->
                <span id="flecha">⌄</span>
            </button>

            <!-- Lista de opciones -->
            <div class="lista-opciones" id="listaOpciones">

                <div class="opcion">Primer elemento</div>

                <div class="opcion">Segundo elemento</div>

                <div class="opcion">Tercer elemento</div>

                <div class="opcion">Cuarto elemento</div>

                <div class="opcion">Quinto elemento</div>

            </div>

        </div>

    </div>

    <!-- Conectar archivo JavaScript -->
    <script src="JS/script.js"></script>

</body>
</html>
